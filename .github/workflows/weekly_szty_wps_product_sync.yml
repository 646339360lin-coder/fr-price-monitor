name: Weekly SZTY WPS Product List Sync

on:
  schedule:
    - cron: "0 16 * * 0"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: szty-wps-product-list-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Sync SZTY product list from WPS
        env:
          WPS_SCRIPT_WEBHOOK: ${{ secrets.SZTY_WPS_SCRIPT_WEBHOOK }}
          WPS_AIRSCRIPT_TOKEN: ${{ secrets.WPS_AIRSCRIPT_TOKEN }}
        run: |
          python sync_wps_product_list.py \
            --output product_list_szty.json \
            --market NL \
            --site Amazon.nl \
            --source "WPS AirScript: SZTY备货表格-20260428 / 产品清单" \
            --include-all-valid-asins

      - name: Commit synchronized SZTY product list
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Sync SZTY product list from WPS"
          file_pattern: "product_list_szty.json"
