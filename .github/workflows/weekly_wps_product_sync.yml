name: Weekly WPS Product List Sync

on:
  schedule:
    - cron: "30 1 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wps-product-list-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Sync product list from WPS
        env:
          WPS_SCRIPT_WEBHOOK: ${{ secrets.WPS_SCRIPT_WEBHOOK }}
          WPS_AIRSCRIPT_TOKEN: ${{ secrets.WPS_AIRSCRIPT_TOKEN }}
        run: python sync_wps_product_list.py

      - name: Commit synchronized product list
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Sync product list from WPS"
          file_pattern: "product_list.json"
